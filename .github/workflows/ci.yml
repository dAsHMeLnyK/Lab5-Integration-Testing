name: API CI (Build & Tests)
on:
  push:
    branches: [ "main", "lab5-*" ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0
      - name: Build
        run: dotnet build
      - name: Run Integration Tests
        run: dotnet test --filter Category=Integration